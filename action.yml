name: "Merge Gatekeeper"
description: "Get better merge control"
branding:
  icon: git-merge
  color: orange
  # Required permissions: checks: read, statuses: read, actions: read
  # actions: read is needed to detect superseded workflow runs, which prevents
  # false failures when concurrent runs cancel each other.
  # contents: read is additionally needed when ref is a branch or tag name
  # (it is resolved to a commit SHA via the commits API).
inputs:
  token:
    description: "GitHub token (defaults to github.token when omitted; or set GITHUB_TOKEN env)"
    required: false
    default: ${{ github.token }}
  self:
    description: "set self job name"
    required: false
    default: "merge-gatekeeper"
  interval:
    description: "set validate interval second (default 5)"
    required: false
    default: "5"
  timeout:
    description: "set validate timeout second (default 600)"
    required: false
    default: "600"
  ignored:
    description: "set ignored jobs (comma-separated list)"
    required: false
    default: ""
  confirm-polls:
    description: "consecutive green polls observing the same jobs required before reporting success (default 3)"
    required: false
    default: "3"
  empty-grace:
    description: "when no jobs are discovered, also wait this many seconds before reporting success (default 30)"
    required: false
    default: "30"
  ref:
    description: "set ref of github repository. the ref can be a SHA, a branch name, or tag name"
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  debug:
    description: "enable debug logging (also auto-enabled when GitHub Actions 'Enable debug logging' is on via ACTIONS_STEP_DEBUG)"
    required: false
    default: "false"
runs:
  using: "docker"
  # A prebuilt image, published by .github/workflows/release-image.yaml when this repo is
  # tagged, instead of a Dockerfile rebuilt on every consumer run: the rebuild pulled its Go
  # base from public.ecr.aws each time and that registry's 429 data limit failed the
  # gatekeeper — a required check — often enough to eject PRs from merge queues.   # v1.4.0, by digest: a re-pushed tag cannot change what consumers run.
  image: "docker://ghcr.io/starkware-libs/merge-gatekeeper@sha256:cc80dc0322dd456092b0b7fe762fd2f6c9e31e8adfffa285ed8c998ee97a642c"
  args:
    - "validate"
    - "--token=${{ inputs.token }}"
    - "--self=${{ inputs.self }}"
    - "--interval=${{ inputs.interval }}"
    - "--ref=${{ inputs.ref }}"
    - "--timeout=${{ inputs.timeout }}"
    - "--ignored=${{ inputs.ignored }}"
    - "--confirm-polls=${{ inputs.confirm-polls }}"
    - "--empty-grace=${{ inputs.empty-grace }}"
    - "--debug=${{ inputs.debug }}"
